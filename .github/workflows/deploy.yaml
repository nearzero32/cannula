name: Deploy Production

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cannula-production
  cancel-in-progress: false

jobs:
  validate:
    name: Security gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7.4.11-alpine
        ports:
          - 16380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NODE_ENV: test
      MONGODB_URI: mongodb://127.0.0.1:27017/cannula_ci
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 16380
      ACCESS_TOKEN_SECRET: ci-access-secret-00000000000000000000000000000000
      REFRESH_TOKEN_SECRET: ci-refresh-secret-1111111111111111111111111111111
      OTP_HASH_SECRET: ci-otp-secret-222222222222222222222222222222222
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript
        run: bun run typecheck
      - name: Tests
        run: bun test
      - name: Real Redis security integration
        run: bun test tests/session-lifecycle.redis.integration.test.ts tests/security-rate-limit.redis.integration.test.ts
        env:
          REDIS_TEST_URL: redis://127.0.0.1:16380
      - name: Start isolated Mongo replica set
        run: |
          docker run --name cannula-ci-mongo -d -p 127.0.0.1:27020:27017 mongo:8.2.12 mongod --replSet rs0 --bind_ip_all
          for attempt in $(seq 1 30); do
            if docker exec cannula-ci-mongo mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep -q 1; then break; fi
            sleep 2
          done
          docker exec cannula-ci-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          sleep 3
      - name: Real Mongo transaction integration
        run: |
          MONGODB_AUTH_TEST_URI="$MONGODB_BASE/cannula_auth_ci?replicaSet=rs0&directConnection=true" bun test tests/auth-flow.mongodb.integration.test.ts
          MONGODB_TEST_URI="$MONGODB_BASE/cannula_pharmacy_ci?replicaSet=rs0&directConnection=true" bun test tests/pharmacy-treatment-request.mongodb.test.ts
          MONGODB_TEST_URI="$MONGODB_BASE/cannula_appointment_ci?replicaSet=rs0&directConnection=true" bun test tests/appointment-concurrency.mongodb.test.ts
        env:
          MONGODB_BASE: mongodb://127.0.0.1:27020
      - name: Production build
        run: bun run build

  deploy:
    name: Deploy to VPS
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy through SSH
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          command_timeout: 14m
          script: |
            set -Eeuo pipefail

            cd /opt/cannula/api

            test -f .env || {
              echo "ERROR: /opt/cannula/api/.env is missing"
              exit 1
            }

            git fetch origin main
            git reset --hard origin/main

            docker compose config -q
            docker compose up -d --build --remove-orphans

            sleep 10
            docker compose ps

            for service in api mongo redis; do
              status="$(docker compose ps --format json "$service" \
                | grep -o '"State":"[^"]*"' \
                | head -1 || true)"

              echo "$service: $status"

              echo "$status" | grep -q '"State":"running"' || {
                echo "ERROR: $service is not running"
                docker compose logs --tail=100 "$service" || true
                exit 1
              }
            done

            for attempt in $(seq 1 20); do
              if curl --fail --silent --show-error http://127.0.0.1:${PORT:-3001}/api/health/ready >/dev/null; then
                break
              fi
              if [ "$attempt" -eq 20 ]; then
                docker compose logs --tail=100 api || true
                exit 1
              fi
              sleep 3
            done

            echo "Deployment completed successfully"
