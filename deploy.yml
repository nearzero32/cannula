name: Deploy Production

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: cannula-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy through SSH
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script_stop: true
          script: |
            set -Eeuo pipefail

            cd /opt/cannula/api

            test -f .env || {
              echo "ERROR: /opt/cannula/api/.env is missing"
              exit 1
            }

            echo "==> Fetching production code"
            git fetch origin main
            git reset --hard origin/main

            echo "==> Validating Docker Compose"
            docker compose --env-file .env config -q

            echo "==> Building API"
            docker compose --env-file .env build api

            echo "==> Starting MongoDB and Redis"
            docker compose --env-file .env up -d mongo redis

            echo "==> Waiting for MongoDB and Redis health"

            wait_for_health() {
              service="$1"
              attempts=30

              for i in $(seq 1 "$attempts"); do
                cid="$(docker compose --env-file .env ps -q "$service")"

                if [ -n "$cid" ]; then
                  state="$(docker inspect -f '{{.State.Status}}' "$cid")"
                  health="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$cid")"

                  echo "$service: state=$state health=$health"

                  if [ "$state" = "running" ] && [ "$health" = "healthy" ]; then
                    return 0
                  fi
                fi

                sleep 2
              done

              echo "ERROR: $service did not become healthy"
              docker compose --env-file .env logs --tail=150 "$service" || true
              return 1
            }

            wait_for_health mongo
            wait_for_health redis

            echo "==> Running MongoDB initialization/migration bootstrap"

            docker compose --env-file .env run \
              --rm \
              --no-deps \
              mongo-init

            echo "==> Starting API"

            docker compose --env-file .env up \
              -d \
              --no-deps \
              --remove-orphans \
              api

            echo "==> Waiting for API health"

            wait_for_health api

            echo "==> Final container status"
            docker compose --env-file .env ps

            echo "==> Production readiness check"

            HTTP_CODE="$(
              curl \
                --silent \
                --output /tmp/cannula-ready.json \
                --write-out '%{http_code}' \
                http://127.0.0.1:3001/api/health/ready
            )"

            cat /tmp/cannula-ready.json || true
            echo
            echo "Readiness HTTP: $HTTP_CODE"

            test "$HTTP_CODE" = "200" || {
              echo "ERROR: Cannula readiness endpoint failed"

              docker compose --env-file .env logs --tail=150 api || true
              docker compose --env-file .env logs --tail=100 mongo || true
              docker compose --env-file .env logs --tail=100 redis || true

              exit 1
            }

            echo "==> Deployment successful"